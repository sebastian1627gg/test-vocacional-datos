<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutores Voluntarios</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 20px; background: #f4f7f6; color: #333; line-height: 1.5; }
    h1 { color: #2c3e50; text-align: center; }
    h2 { color: #2c3e50; font-size: 20px; margin-bottom: 15px; text-align: center; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
    .form-group input[type="text"], 
    .form-group input[type="email"], 
    .form-group select,
    .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; box-sizing: border-box; font-family: inherit; }
    .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; font-size: 14px; }
    .checkbox-group input { margin-top: 4px; }
    .btn-container { display: flex; gap: 10px; margin-top: 20px; }
    button { background: #3498db; color: white; border: none; padding: 12px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
    button:hover { background: #2980b9; }
    button.secondary { background: #95a5a6; }
    button.secondary:hover { background: #7f8c8d; }
    .char-counter { font-size: 12px; color: #7f8c8d; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>

  <h1>Tutores Voluntarios</h1>

  <div class="card" id="step-tutor-form">
    <h2>Registro de Tutor Voluntario</h2>
    
    <div class="form-group">
      <label for="correo">Correo electronico:</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
    </div>

    <div class="form-group">
      <label for="nombre">Nombre completo y apodo con el que deseas ser llamado:</label>
      <input type="text" id="nombre" placeholder="Ej. Juan Perez (Juancho)" required>
    </div>

    <div class="form-group">
      <label for="genero">Genero:</label>
      <select id="genero" required>
        <option value="">Selecciona una opcion...</option>
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="No binario">No binario</option>
        <option value="Prefiero no decirlo">Prefiero no decirlo</option>
      </select>
    </div>

    <div class="form-group">
      <label for="telefono">Numero de telefono (Opcional):</label>
      <input type="text" id="telefono" placeholder="Ej. 3001234567">
    </div>

    <div class="form-group">
      <label for="area">Area en la que te gustaria dar tutorias:</label>
      <select id="area" required>
        <option value="">Selecciona una opcion...</option>
        <option value="Fundamentos de Python">Fundamentos de Python</option>
        <option value="Google Colab y Entornos">Google Colab y Entornos</option>
        <option value="Visual Studio Code">Visual Studio Code</option>
        <option value="Bases de Datos">Bases de Datos</option>
        <option value="Analitica de Datos">Analitica de Datos</option>
        <option value="Ciencia de Datos">Ciencia de Datos</option>
      </select>
    </div>

    <div class="form-group">
      <label for="disponibilidad">Disponibilidad horaria:</label>
      <input type="text" id="disponibilidad" placeholder="Ej. Todos los lunes de 3 a 4 pm" required>
    </div>

    <div class="form-group">
      <label for="interes">Cuentanos sobre tu interes o experiencia en esta tutoria (Maximo 400 caracteres):</label>
      <textarea id="interes" rows="3" maxlength="400" placeholder="Escribe brevemente por que deseas apoyar..." oninput="actualizarContador()"></textarea>
      <div class="char-counter"><span id="counter">0</span> / 400 caracteres</div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="autorizacion" required>
      <label for="autorizacion">Acepto el tratamiento de mis datos personales para fines de gestion de tutores (Obligatorio).</label>
    </div>

    <div class="btn-container">
      <button class="secondary" onclick="window.location.href='index.html'">Volver a la pagina principal</button>
      <button onclick="enviarTutor()">Enviar</button>
    </div>
  </div>

  <div class="card" id="thanks-container" style="display:none; text-align: center;">
    <h2>Respuesta enviada</h2>
    <p>Te agradecemos tu interes en ser tutor voluntario. Tus datos se han registrado con exito.</p>
    <div class="btn-container">
      <button class="secondary" onclick="enviarOtro()">Enviar otra respuesta</button>
      <button onclick="window.location.href='index.html'">Volver a la pagina principal</button>
    </div>
  </div>

  <script>
    const TUTOR_SCRIPT_URL = "PEGA_AQUI_TU_NUEVA_URL_DE_APPS_SCRIPT";

    function actualizarContador() {
      const input = document.getElementById('interes');
      const counter = document.getElementById('counter');
      counter.innerText = input.value.length;
    }

    function enviarTutor() {
      const correo = document.getElementById('correo').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const genero = document.getElementById('genero').value;
      const telefono = document.getElementById('telefono').value.trim();
      const area = document.getElementById('area').value;
      const disponibilidad = document.getElementById('disponibilidad').value.trim();
      const interes = document.getElementById('interes').value.trim();
      const autorizacion = document.getElementById('autorizacion').checked;

      if (!correo || !nombre || !genero || !area || !disponibilidad) {
        alert("Por favor completa los campos obligatorios.");
        return;
      }

      if (!autorizacion) {
        alert("Debes aceptar el tratamiento de datos para continuar.");
        return;
      }

      const datos = {
        correo: correo,
        nombre: nombre,
        genero: genero,
        telefono: telefono ? telefono : "No registra",
        area: area,
        disponibilidad: disponibilidad,
        interes: interes ? interes : "No registra",
        autorizacion: "Aceptado"
      };

      if (TUTOR_SCRIPT_URL && TUTOR_SCRIPT_URL !== "PEGA_AQUI_TU_NUEVA_URL_DE_APPS_SCRIPT") {
        fetch(TUTOR_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(datos)
        }).catch(err => console.error("Error al enviar:", err));
      }

      document.getElementById('step-tutor-form').style.display = 'none';
      document.getElementById('thanks-container').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function enviarOtro() {
      document.getElementById('correo').value = '';
      document.getElementById('nombre').value = '';
      document.getElementById('genero').value = '';
      document.getElementById('telefono').value = '';
      document.getElementById('area').value = '';
      document.getElementById('disponibilidad').value = '';
      document.getElementById('interes').value = '';
      document.getElementById('autorizacion').checked = false;
      document.getElementById('counter').innerText = '0';

      document.getElementById('thanks-container').style.display = 'none';
      document.getElementById('step-tutor-form').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
</body>
</html>
