<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Vocacional - Roles de Datos</title>
  <!-- Tipografía Inter (referencia estilo Python Colombia) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <h1>Test Vocacional</h1>

  <!-- BOTÓN PARA IR AL FORMULARIO DE TUTORES -->
  <div style="text-align: center; margin-bottom: 24px;">
    <button onclick="window.location.href='tuto.html'" class="btn-tutor" style="max-width: 320px;">Inscribirme como Tutor Voluntario</button>
  </div>

  <!-- SECCIÓN 1: DATOS PERSONALES -->
  <div class="card" id="step-form">
    <h2>Datos personales</h2>
    
    <div class="form-group">
      <label for="nombre">Nombre completo:</label>
      <input type="text" id="nombre" placeholder="Ej. Ana Pérez" required>
    </div>

    <div class="form-group">
      <label for="correo">Correo electrónico:</label>
      <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
    </div>

    <div class="form-group">
      <label for="genero">Género:</label>
      <select id="genero" required>
        <option value="">Selecciona una opción...</option>
        <option value="Femenino">Femenino</option>
        <option value="Masculino">Masculino</option>
        <option value="No binario">No binario</option>
        <option value="Prefiero no decirlo">Prefiero no decirlo</option>
      </select>
    </div>

    <div class="form-group">
      <label for="edad">Rango de edad:</label>
      <select id="edad" required>
        <option value="">Selecciona una opción...</option>
        <option value="Menos de 18 años">Menos de 18 años</option>
        <option value="18 a 24 años">18 a 24 años</option>
        <option value="25 a 34 años">25 a 34 años</option>
        <option value="35 a 44 años">35 a 44 años</option>
        <option value="45 años o más">45 años o más</option>
      </select>
    </div>

    <div class="form-group">
      <label for="perfil">Perfil u ocupación principal:</label>
      <select id="perfil" required>
        <option value="">Selecciona una opción...</option>
        <option value="Estudiante">Estudiante</option>
        <option value="Trabaja en tecnología">Trabaja en tecnología</option>
        <option value="Otro campo ajeno a la tecnología">Otro campo ajeno a la tecnología</option>
      </select>
    </div>

    <div class="form-group">
      <label for="experiencia">Años de experiencia en tu área actual:</label>
      <select id="experiencia" required>
        <option value="">Selecciona una opción...</option>
        <option value="Sin experiencia (0 años)">Sin experiencia (0 años)</option>
        <option value="Menos de 1 año">Menos de 1 año</option>
        <option value="1 a 3 años">1 a 3 años</option>
        <option value="Más de 3 años">Más de 3 años</option>
      </select>
    </div>

    <div class="form-group">
      <label for="sobre_ti">Cuéntanos más sobre ti y tu experiencia:</label>
      <textarea id="sobre_ti" rows="3" maxlength="300" placeholder="Escribe brevemente sobre tus metas, intereses o trayectoria profesional..." oninput="actualizarContador()"></textarea>
      <div class="char-counter"><span id="counter">0</span> / 300 caracteres</div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="autorizacion" required>
      <label for="autorizacion">Autorizo el tratamiento de mis datos personales con fines estadísticos y de orientación vocacional (Obligatorio).</label>
    </div>

    <button onclick="irAlTest()" style="margin-top: 20px;">Siguiente</button>
  </div>

  <!-- SECCIÓN 2: TEST VOCACIONAL -->
  <div class="card" id="step-test" style="display:none;">
    <h2>Resuelve las preguntas</h2>
    <div id="test-container"></div>
    <div class="btn-container">
      <button class="secondary" onclick="regresarAlFormulario()">Retroceder</button>
      <button onclick="calcularResultado()">Enviar Respuestas y Ver Resultado</button>
    </div>
  </div>

  <!-- SECCIÓN 3: RESULTADOS -->
  <div class="card" id="result-container" style="display:none;">
    <h2>Resultados: ¿Hacia dónde apunta tu brújula?</h2>
    <div id="result"></div>
    <div class="btn-container">
      <button class="secondary" onclick="reiniciarTest()">Mandar otra respuesta</button>
      <button class="success" onclick="finalizarTest()">Finalizar</button>
    </div>
  </div>

  <!-- SECCIÓN 4: PANTALLA DE AGRADECIMIENTO AL FINALIZAR -->
  <div class="card" id="thanks-container" style="display:none; text-align: center;">
    <h2>¡Gracias por realizar el Test Vocacional!</h2>
    <p>Tus respuestas se han registrado con éxito. Esperamos que este resultado te oriente en tu camino en el mundo de los datos.</p>
    <button style="max-width: 250px; margin: 20px auto 0 auto;" onclick="reiniciarTest()">Realizar el test de nuevo</button>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
